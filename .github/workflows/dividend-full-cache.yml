name: 分红全量缓存（一次性）

on:
  workflow_dispatch:      # 只手动触发，不排期

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    # 全市场约 5500 次逐股请求，可能跑一小时以上。
    # 每个股票有 120 天 TTL，超时后重跑会从断点继续（已缓存的直接跳过）。
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: data
          key: ashare-data-${{ github.run_id }}
          restore-keys: ashare-data-

      - name: 全市场拉一遍分红历史
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python -m src.cli fetch --with-dividend --dividend-all
