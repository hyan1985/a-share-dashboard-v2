name: 每日更新看板

on:
  schedule:
    # 21:30 北京时间（UTC 13:30）。18:30 太早，tushare 当天日线还没清洗完
    - cron: "30 16 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 数据目录约 30MB/年，缓存住之后每次只拉增量，冷启动只付一次
      - name: 恢复数据缓存
        uses: actions/cache@v4
        with:
          path: data
          key: ashare-data-${{ github.run_id }}
          restore-keys: ashare-data-

      - name: 增量更新（已缓存数据时）
        if: hashFiles('data/.watermark.json') != ''
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python -m src.cli fetch

      # 冷启动：分表回填。fetch() 每次都会顺带跑财务/分红/股吧，
      # 所以只调一次日线（200 天），其余表 40 天足够。
      # 注意 --backfill 的单位是「年」，回填自然日必须用 --backfill-days。
      - name: 冷启动回填
        if: hashFiles('data/.watermark.json') == ''
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          echo "冷启动：日线回填 200 个自然日（够算 MA120）"
          python -m src.cli fetch --backfill-days 200 --table daily
          echo "其余表回填 40 个自然日"
          python -m src.cli fetch --backfill-days 40 --table daily_basic
          python -m src.cli fetch --backfill-days 40 --table index_daily
          python -m src.cli fetch --backfill-days 40 --table limit_list_d

      - name: 生成看板
        run: python -m src.cli run

      - name: 检查产物
        run: |
          test -f output/index.html || { echo "看板没生成"; exit 1; }
          ls -lh output/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
