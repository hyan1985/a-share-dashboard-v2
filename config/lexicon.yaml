bearish_regex:
- tag: 反讽所谓
  pattern: 所谓的?.{0,10}(?:牛市|慢牛|长线|主升|起飞|抄底|满仓|加仓|突破|反弹|黄金坑|价值投资)
  skip_if_news: false
- tag: 反讽这就是
  pattern: 这就是你们所谓的
  skip_if_news: false
- tag: 反讽什么呢
  pattern: (?:什么|哪来的|哪有|吹的|假的?)(?:牛市|慢牛|主升|起飞|抄底|长线)
  skip_if_news: false
- tag: 阴阳对比
  pattern: (?:牛市|慢牛|起飞|抄底|满仓|主升|反弹|长线|价值投资|黄金买点).{0,14}(?:半山腰|地板|地心|腰斩|跌停|创新低|割肉|血洗|姥姥家|跌麻|亏麻)
  skip_if_news: false
- tag: 阴阳夸奖
  pattern: (?:真会|真棒|厉害|太牛了|可以的|真香).{0,12}(?:跌|腰斩|创新低|跌停|半山腰|割肉|亏)
  skip_if_news: false
- tag: 嘲讽反问
  pattern: (?:牛市|起飞|抄底|主升).{0,4}[？?].{0,8}(?:屁|呵呵|呢)|(?:抄|涨|飞).{0,2}你个头|呵呵.*(?:牛市|慢牛|起飞)|又是.{0,6}(?:主升浪?|抄底|牛市|起飞).{0,12}天天
  skip_if_news: false
- tag: 转投海外
  pattern: (?:打算|准备|想去|改|只|转).{0,6}(?:玩|买|搞|做).{0,4}(?:纳指|日经|美股|港股|外盘|标普|恒指|日经225)
  skip_if_news: true
- tag: 去玩海外
  pattern: (?:去|来).{0,2}(?:玩|买).{0,4}(?:纳指|日经|美股|港股|外盘)
  skip_if_news: true
- tag: 海外ETF
  pattern: (?:玩|买|做|只买|只做|投).{0,4}(?:纳指|日经|美股|港股|外盘).{0,10}ETF
  skip_if_news: true
- tag: 大A心碎
  pattern: 对大[Aa].{0,18}(?:希望|道心).{0,6}碎
  skip_if_news: false
- tag: 外盘涨A跌
  pattern: (?:美股|纳指|日经|外盘|原油|老美).{0,14}(?:涨|牛|新高).{0,18}(?:你还跌|你跌|大[Aa].{0,6}跌|A股.{0,6}跌|我们.{0,4}跌)
  skip_if_news: false
- tag: 弃市
  pattern: (?:反正|已经|实在|真的|准备).{0,4}(?:不玩|清仓|销户|离场|退场)
  skip_if_news: false
- tag: 反讽股神
  pattern: (?:股神|大师|高手|老师).{0,6}(?:又|真|果然|不愧)
  skip_if_news: false
- tag: 反讽感谢主力
  pattern: (?:感谢|谢谢|多谢)(?:主力|机构|庄家|大A|证监会)
  skip_if_news: false
- tag: 反讽牛回速归
  pattern: 牛回速归|牛来了|大牛市来了|慢牛|长牛
  skip_if_news: false
- tag: 反讽稳中向好
  pattern: 稳中向好|稳中向差|长期向好|基本面良好
  skip_if_news: false
- tag: 反讽见证历史
  pattern: 见证历史|历史性时刻|载入史册
  skip_if_news: false
- tag: 自嘲割肉
  pattern: (?:天台|跳楼|销户|卸载|躺平|装死|摆烂|麻了|绷不住|破防)
  skip_if_news: false
- tag: 抄底被埋
  pattern: 抄底.{0,6}(?:被埋|亏|套|凉|死|割)
  skip_if_news: false
- tag: 反讽哈哈
  pattern: (?:牛市|慢牛|抄底|利好|反弹|满仓|主升|涨停|起飞).{0,12}[哈呵]{2,}
  skip_if_news: false
- tag: 反讽哈哈2
  pattern: '[哈呵]{2,}.{0,12}(?:新低|割肉|亏|崩|套|底)'
  skip_if_news: false
- tag: 反讽扫货
  pattern: (?:天天抄底|全民抄底|又是利好|永远利好|利好出尽)
  skip_if_news: false
neutral_patterns:
- 指数收涨
- 集体收涨
- 刷新纪录
- 每经AI快讯
- 日韩股市
- 快讯.*收涨
- ETF调入
- 调入.*ETF
- 成分股调整
- 指数编制
